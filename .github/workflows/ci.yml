name: CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs only for pull requests: pushes to master and dev deploy
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SECRET_KEY: ci-only-not-secret
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff shellcheck-py
      - name: Python (syntax errors, undefined names, unused imports)
        run: ruff check --select E9,F api rustdesk_server_api manage.py
      - name: Installer shell scripts
        run: shellcheck -S error static/configs/*.sh && shellcheck deploy/*.sh

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations apply to an empty database
        run: python manage.py migrate --noinput
      - name: Static files can be collected
        run: python manage.py collectstatic --noinput
      - name: Tests
        run: python manage.py test api

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag rustdesk-api:ci .
      - name: Run migrations and start the container
        run: |
          mkdir -p "$RUNNER_TEMP/db"
          chmod 777 "$RUNNER_TEMP/db"
          opts="--env SECRET_KEY=ci-only --env ALLOWED_HOSTS=127.0.0.1 -v $RUNNER_TEMP/db:/app/db"
          docker run --rm $opts rustdesk-api:ci python manage.py migrate --noinput
          docker run --detach --name api -p 21114:21114 $opts rustdesk-api:ci
      - name: Server responds
        run: |
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:21114/api/user_action && exit 0
            sleep 2
          done
          docker logs api
          exit 1

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Check requirements for known vulnerabilities
        run: pip-audit -r requirements.txt

  deploy:
    name: Deploy to production
    # Only after all checks passed, only from master
    needs: [lint, test, docker, audit]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      runner-label: rustdesk-deploy
      default-path: /opt/rustdesk-api
    secrets: inherit

  deploy-staging:
    name: Deploy to staging
    # Only after all checks passed, only from dev, and only once enabled with the
    # repository variable STAGING_ENABLED=true (otherwise the job would wait for a
    # runner that does not exist yet)
    needs: [lint, test, docker, audit]
    if: vars.STAGING_ENABLED == 'true' && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      runner-label: rustdesk-staging
      default-path: /opt/rustdesk-api-staging
    secrets: inherit
